<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Парсер PDF</title>
  <!-- Подключаем PDF.js для точного чтения текста из PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #1f2937; padding: 15px; margin: 0; }
    .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; text-align: center; }
    
    .upload-zone { border: 2px dashed #2563eb; padding: 25px; text-align: center; background: #eff6ff; border-radius: 10px; cursor: pointer; margin-bottom: 15px; }
    .upload-zone p { margin: 5px 0; color: #1e40af; font-weight: 500; }
    
    .item-card { background: #f9fafb; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 10px; }
    .item-card h3 { margin: 0 0 8px 0; font-size: 15px; }
    .color-tag { background: #e5e7eb; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: normal; }
    
    .size-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
    .size-box { background: #fff; padding: 6px; border-radius: 4px; border: 1px solid #d1d5db; text-align: center; }
    .size-box.active { border-color: #10b981; background: #ecfdf5; }
    .size-name { font-size: 10px; color: #6b7280; display: block; }
    .size-num { font-size: 13px; font-weight: bold; color: #059669; }
    .size-num.zero { color: #9ca3af; font-weight: normal; }
    
    #status { text-align: center; color: #2563eb; font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>

<div class="container">
  <h2>Анализатор PDF Накладных</h2>

  <div class="upload-zone" onclick="document.getElementById('pdfInput').click()">
    <p>📄 Выберите или перетащите PDF файл накладной</p>
    <span style="font-size: 12px; color: #6b7280;">Чтение происходит напрямую из структуры файла</span>
  </div>
  <input type="file" id="pdfInput" accept="application/pdf" style="display:none" onchange="processPDF(this.files[0])">

  <div id="status"></div>
  <div id="results"></div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  async function processPDF(file) {
    if (!file) return;
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    status.innerText = "Чтение PDF файла...";
    results.innerHTML = "";

    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullTextLines = [];

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        
        // Группируем элементы по Y-координате (высоте строки в документe)
        let linesByY = {};
        textContent.items.forEach(item => {
          const y = Math.round(item.transform[5]); // Y-координата
          if (!linesByY[y]) linesByY[y] = [];
          linesByY[y].push({ x: item.transform[4], text: item.str });
        });

        // Сортируем строки сверху вниз и слова слева направо
        const sortedY = Object.keys(linesByY).sort((a, b) => b - a);
        sortedY.forEach(y => {
          const lineWords = linesByY[y].sort((a, b) => a.x - b.x).map(w => w.text).join(' ');
          fullTextLines.push(lineWords);
        });
      }

      status.innerText = "";
      parsePDFText(fullTextLines);

    } catch (err) {
      console.error(err);
      status.innerText = "Ошибка при обработке PDF файла.";
    }
  }

  function parsePDFText(lines) {
    const categories = ['Зиппер', 'Свитшот', 'Футболка', 'Кепка', 'Худи', 'Сумка', 'Ремувка', 'Брюки', 'Шорты', 'Куртка'];
    const colors = ['черный', 'черная', 'черное', 'серый', 'серая', 'серое', 'белый', 'белая', 'коричневый', 'бежевый', 'красный', 'синий'];

    let totals = {};

    lines.forEach(line => {
      let cleanLine = line.trim();
      if (!cleanLine) return;

      // 1. Поиск категории
      let category = categories.find(c => new RegExp(c, 'i').test(cleanLine));
      if (!category) {
        if (/VDZP/i.test(cleanLine)) category = 'Зиппер';
        else if (/VDSW/i.test(cleanLine)) category = 'Свитшот';
        else if (/VDTS/i.test(cleanLine)) category = 'Футболка';
        else if (/VDCP/i.test(cleanLine)) category = 'Кепка';
        else if (/VDHD/i.test(cleanLine)) category = 'Худи';
      }
      if (!category) return;

      // 2. Поиск цвета
      let color = 'не указан';
      colors.forEach(c => {
        if (new RegExp(c, 'i').test(cleanLine)) {
          if (/черн/i.test(c)) color = 'Черный';
          else if (/сер/i.test(c)) color = 'Серый';
          else if (/бел/i.test(c)) color = 'Белый';
          else color = c;
        }
      });

      // 3. Поиск размера
      let size = 'ONE SIZE';
      const sizeMatch = cleanLine.match(/\b(3XL|2XL|XL|L|M|S|3ХЛ|2ХЛ|ХЛ|Л|М|С)\b/i);
      if (sizeMatch) {
        const val = sizeMatch[1].toUpperCase();
        const map = { '3ХЛ':'3XL', '2ХЛ':'2XL', 'ХЛ':'XL', 'Л':'L', 'М':'M', 'С':'S' };
        size = map[val] || val;
      }

      // 4. Извлечение количества
      let count = 0;
      
      // Убираем цены с копейками и крупную сумму
      let tempLine = cleanLine.replace(/\d+[\s.]?\d{3}([.,]\d{2})?/g, ''); 
      tempLine = tempLine.replace(/\d+[.,]\d{2}/g, ''); 

      // Вытаскиваем оставшиеся числа
      const nums = tempLine.match(/\b\d+\b/g);
      if (nums && nums.length > 0) {
        const validCounts = nums.map(n => parseInt(n, 10)).filter(n => n > 0 && n < 500);
        if (validCounts.length > 0) {
          count = validCounts[validCounts.length - 1]; // Берем кол-во из соответствующей колонки
        }
      }

      if (count > 0) {
        const key = `${category}_${color}`;
        if (!totals[key]) {
          totals[key] = { category, color, sizes: { 'ONE SIZE': 0, 'S': 0, 'M': 0, 'L': 0, 'XL': 0, '2XL': 0, '3XL': 0 } };
        }
        if (totals[key].sizes[size] !== undefined) {
          totals[key].sizes[size] += count;
        }
      }
    });

    render(totals);
  }

  function render(totals) {
    const res = document.getElementById('results');
    if (Object.keys(totals).length === 0) {
      res.innerHTML = "<p style='text-align:center; color:#9ca3af;'>Товарные позиции в PDF не найдены.</p>";
      return;
    }

    let html = '';
    for (const k in totals) {
      const g = totals[k];
      html += `<div class="item-card">
        <h3>${g.category} <span class="color-tag">${g.color}</span></h3>
        <div class="size-grid">`;
      
      for (const [sz, count] of Object.entries(g.sizes)) {
        if (sz === 'ONE SIZE' && count === 0) continue;
        html += `<div class="size-box ${count > 0 ? 'active' : ''}">
          <span class="size-name">${sz}</span>
          <span class="${count > 0 ? 'size-num' : 'size-num zero'}">${count} шт</span>
        </div>`;
      }
      html += `</div></div>`;
    }
    res.innerHTML = html;
  }
</script>

</body>
</html>
