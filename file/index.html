<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализатор Накладных: Одежда, Размеры и Цвета</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 { text-align: center; margin-top: 0; font-size: 20px; }
    
    .upload-zone {
      border: 2px dashed #2563eb;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background-color: #eff6ff;
      cursor: pointer;
      margin-bottom: 15px;
    }
    .upload-zone.hover { background-color: #dbeafe; }
    
    .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn {
      flex: 1; padding: 12px; background: #2563eb; color: #fff;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center;
    }
    .btn:active { opacity: 0.85; }
    
    input[type="file"] { display: none; }
    
    .url-input { display: flex; gap: 8px; margin-bottom: 15px; }
    .url-input input {
      flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;
    }
    
    #preview {
      width: 100%; max-height: 250px; object-fit: contain; margin-bottom: 15px;
      border-radius: 8px; display: none;
    }

    #status { text-align: center; font-weight: bold; margin: 12px 0; color: #2563eb; }

    .results { margin-top: 20px; border-top: 2px solid #e5e7eb; padding-top: 15px; }
    .item-card {
      background: #f9fafb;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-bottom: 15px;
    }
    .item-card h3 { margin: 0 0 10px 0; font-size: 16px; color: #111827; }
    .color-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      background: #e5e7eb;
      color: #374151;
      margin-left: 6px;
    }

    .size-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 6px;
    }
    .size-box {
      background: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      text-align: center;
    }
    .size-box.active {
      border-color: #10b981;
      background-color: #ecfdf5;
    }
    .size-name { font-size: 11px; color: #6b7280; display: block; }
    .size-num { font-size: 14px; font-weight: bold; color: #059669; }
    .size-num.zero { color: #9ca3af; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  <h2>Анализатор Таблиц и Подсчет Размеров</h2>

  <div class="upload-zone" id="dropZone">
    <p><b>Перетащите сюда фото накладной</b></p>
    <p>или нажмите для выбора файла</p>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="document.getElementById('cameraInput').click()">📷 Сделать фото</button>
    <button class="btn" onclick="document.getElementById('galleryInput').click()">🖼 Из галереи</button>
  </div>

  <div class="url-input">
    <input type="text" id="imageUrl" placeholder="Вставьте ссылку на фото...">
    <button class="btn" style="flex: initial;" onclick="processUrl()">Загрузить</button>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFiles(this.files)">
  <input type="file" id="galleryInput" accept="image/*" onchange="handleFiles(this.files)">
  <input type="file" id="fileInput" accept="image/*" onchange="handleFiles(this.files)">

  <img id="preview" alt="Превью фото">
  <div id="status"></div>
  <div class="results" id="results"></div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const status = document.getElementById('status');
  const resultsDiv = document.getElementById('results');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('hover');
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  function processUrl() {
    const url = document.getElementById('imageUrl').value.trim();
    if (url) {
      preview.src = url;
      preview.style.display = 'block';
      recognizeText(url);
    }
  }

  function handleFiles(files) {
    if (!files.length) return;
    const file = files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      recognizeText(e.target.result);
    };
    reader.readAsDataURL(file);
  }

  async function recognizeText(imageSource) {
    status.innerText = "Распознавание текста (OCR)...";
    resultsDiv.innerHTML = "";

    try {
      const worker = await Tesseract.createWorker('rus+eng');
      const ret = await worker.recognize(imageSource);
      await worker.terminate();
      
      status.innerText = "Подсчет элементов...";
      parseTableData(ret.data.text);
      status.innerText = "";
    } catch (err) {
      console.error(err);
      status.innerText = "Ошибка при сканировании фото.";
    }
  }

  function parseTableData(text) {
    // Популярные категории + авто-определение любого другого первого слова
    const knownCategories = ['Зиппер', 'Свитшот', 'Футболка', 'Кепка', 'Худи', 'Сумка', 'Ремувка', 'Брюки', 'Шорты', 'Куртка'];
    
    // Поддерживаемые цвета
    const knownColors = ['черный', 'черная', 'черное', 'серый', 'серая', 'серое', 'коричневый', 'коричневая', 'белый', 'белая', 'белое', 'бежевый', 'красный', 'синий', 'зеленый'];

    const targetSizes = ['ONE SIZE', 'S', 'M', 'L', 'XL', '2XL', '3XL'];

    // Хранилище: { "Зиппер (черный)": { S:0, M:0... }, "Кепка (белая)": ... }
    let totals = {};

    const lines = text.split('\n');

    lines.forEach(line => {
      let category = null;
      let color = 'не указан';

      // 1. Поиск Категории
      knownCategories.forEach(cat => {
        if (new RegExp(cat, 'i').test(line)) {
          category = cat;
        }
      });

      // Поиск артикула, если название не распознано напрямую
      if (!category) {
        if (/VDZP/i.test(line)) category = 'Зиппер';
        else if (/VDSW/i.test(line)) category = 'Свитшот';
        else if (/VDTS/i.test(line)) category = 'Футболка';
        else if (/VDCP/i.test(line)) category = 'Кепка';
        else if (/VDHD/i.test(line)) category = 'Худи';
      }

      if (!category) return;

      // 2. Поиск Цвета
      knownColors.forEach(c => {
        if (new RegExp(c, 'i').test(line)) {
          // Приводим род цвета к базовой форме
          if (/черн/i.test(c)) color = 'черный';
          else if (/сер/i.test(c)) color = 'серый';
          else if (/коричн/i.test(c)) color = 'коричневый';
          else if (/бел/i.test(c)) color = 'белый';
          else color = c;
        }
      });

      // 3. Поиск Размера
      let size = null;
      const sizeMatch = line.match(/\b(3XL|2XL|XL|L|M|S)\b/i);

      if (sizeMatch) {
        size = sizeMatch[1].toUpperCase();
      } else if (/\b(3ХЛ|2ХЛ|ХЛ|Л|М|С)\b/i.test(line)) {
        const cyr = line.match(/\b(3ХЛ|2ХЛ|ХЛ|Л|М|С)\b/i)[1].toUpperCase();
        const mapCyr = { '3ХЛ': '3XL', '2ХЛ': '2XL', 'ХЛ': 'XL', 'Л': 'L', 'М': 'M', 'С': 'S' };
        size = mapCyr[cyr];
      } else {
        // Если размера нет (например, для кепок или безнапорных товаров), ставим ONE SIZE
        size = 'ONE SIZE';
      }

      // 4. Поиск Количество (Кол-во)
      let count = 0;
      const matches = [...line.matchAll(/\b(\d+)\b/g)];
      
      const countCandidate = line.match(/руб\s*(\d+)\s*\d+/i) || line.match(/шт\s*(\d+)/i);
      if (countCandidate) {
        count = parseInt(countCandidate[1], 10);
      } else if (matches.length >= 2) {
        count = parseInt(matches[matches.length - 2][0], 10);
      }

      // Добавление в сводку
      if (category && size && count > 0) {
        const itemKey = `${category}`;
        const groupKey = `${itemKey}___${color}`;

        if (!totals[groupKey]) {
          totals[groupKey] = {
            category: category,
            color: color,
            sizes: { 'ONE SIZE': 0, 'S': 0, 'M': 0, 'L': 0, 'XL': 0, '2XL': 0, '3XL': 0 }
          };
        }
        
        if (totals[groupKey].sizes[size] !== undefined) {
          totals[groupKey].sizes[size] += count;
        }
      }
    });

    displayResults(totals);
  }

  function displayResults(totals) {
    if (Object.keys(totals).length === 0) {
      resultsDiv.innerHTML = '<p style="text-align:center; color:#9ca3af;">Товарных позиций не найдено.</p>';
      return;
    }

    let html = '<h3>Сводные результаты:</h3>';

    for (const key in totals) {
      const group = totals[key];
      html += `
        <div class="item-card">
          <h3>${group.category} <span class="color-tag">${group.color}</span></h3>
          <div class="size-grid">
      `;
      
      for (const [sz, count] of Object.entries(group.sizes)) {
        // Не показываем ONE SIZE, если он 0
        if (sz === 'ONE SIZE' && count === 0) continue;

        const activeClass = count > 0 ? 'active' : '';
        const numClass = count > 0 ? 'size-num' : 'size-num zero';
        html += `
          <div class="size-box ${activeClass}">
            <span class="size-name">${sz}</span>
            <span class="${numClass}">${count} шт</span>
          </div>
        `;
      }
      
      html += `
          </div>
        </div>
      `;
    }

    resultsDiv.innerHTML = html;
  }
</script>

</body>
</html>
